<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2E26">
<title>31en</title>
<meta name="description" content="Scorebord en speeltafel voor het kaartspel 31en.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0E2E26; --deep:#08201A; --edge:#17453A;
  --cream:#F4EDDF; --ink:#182320;
  --brass:#DFA33C; --brass-dim:#8C6722;
  --red:#B23A2E; --red-soft:#E88F7E;
  --mint:#BFD9CC; --mint-dim:#759486;
  --sans:'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--deep);
  background-image:radial-gradient(120% 80% at 50% 0%, var(--felt) 0%, var(--deep) 100%);
  background-attachment:fixed;
  color:var(--cream);
  font-family:system-ui,-apple-system,sans-serif;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:460px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
}
button{font-family:var(--sans);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- type ---------- */
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint-dim)}
.title{font-family:var(--serif);font-weight:900;font-size:28px;line-height:1.1;color:var(--brass);margin:0}
.sub{color:var(--mint-dim);font-size:13px;line-height:1.55}
.mint{color:var(--mint)}
.big-num{font-family:var(--serif);font-weight:900;font-size:64px;line-height:1;color:var(--brass)}

/* ---------- layout ---------- */
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.center{justify-content:center}
.stack>*+*{margin-top:10px}
.panel{background:rgba(0,0,0,.19);border:1px solid var(--edge);border-radius:14px;padding:14px;margin-bottom:14px}
.mb{margin-bottom:14px}
.mt{margin-top:14px}
.hero{text-align:center;padding-top:32px}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;border-radius:12px;padding:13px 16px;
  font-weight:700;font-size:15px;border:2px solid var(--edge);
  background:transparent;color:var(--mint);
}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--deep)}
.btn.danger{border-color:#8C3A2E;color:var(--red-soft)}
.btn[disabled]{opacity:.32;cursor:not-allowed}
.btn.slim{padding:10px 12px;font-size:14px}
.linkbtn{background:none;border:none;color:var(--mint-dim);font-size:13px;padding:6px 0}
.pair{display:flex;gap:10px}
.pair>.btn{flex:1}

/* ---------- inputs ---------- */
input[type=text]{
  width:100%;background:var(--deep);border:1px solid var(--edge);border-radius:10px;
  padding:11px 12px;color:var(--cream);font-size:16px;font-family:inherit;
}
input.code{font-family:var(--serif);font-size:26px;letter-spacing:.28em;text-align:center;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{background:none;border:none;color:var(--brass);font-size:26px;line-height:1;padding:2px 6px}
.stepper .val{font-family:var(--serif);font-size:24px;font-weight:700;min-width:24px;text-align:center}
.opt{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 0;color:var(--cream)}
.opt .lab{font-size:14px}
.opt .val{font-size:13px;color:var(--brass)}

/* ---------- cards ---------- */
.hand,.middle{display:flex;gap:10px;align-items:flex-end}
.middle{gap:8px}
.card{
  position:relative;flex:0 0 auto;border-radius:10px;
  background:var(--cream);border:2px solid rgba(0,0,0,.09);
  box-shadow:0 4px 10px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .15s ease, box-shadow .15s ease;
  width:74px;height:106px;color:var(--ink);
}
.card.lg{width:92px;height:132px}
.card.sm{width:46px;height:66px}
.card.red{color:var(--red)}
.card .corner{position:absolute;top:4px;left:6px;font-family:var(--serif);font-weight:700;font-size:12px}
.card .pip{font-size:21px;line-height:1}
.card.lg .pip{font-size:26px}
.card.sm .pip{font-size:13px}
.card .rank{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.1}
.card.lg .rank{font-size:25px}
.card.sm .rank{font-size:12px}
.card.back{
  background:repeating-linear-gradient(45deg,var(--edge) 0 6px,var(--deep) 6px 12px);
  border-color:var(--brass-dim);color:var(--brass);
}
.card.back .mark{font-family:var(--serif);font-size:16px;opacity:.8}
.card.sel{transform:translateY(-10px);border-color:var(--brass);box-shadow:0 8px 18px rgba(0,0,0,.5),0 0 0 3px rgba(223,163,60,.35)}
.card.dim{opacity:.45}
.card.tap{cursor:pointer}
.blindwrap{text-align:center;margin-left:10px}
.blindwrap .lbl{font-size:10px;color:var(--mint-dim);margin-top:4px}

/* ---------- meter ---------- */
.meter{width:100%}
.meter .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.meter .score{font-family:var(--serif);font-weight:700;font-size:22px}
.meter .score.hot{color:var(--brass)}
.meter .track{height:7px;background:rgba(0,0,0,.28);border-radius:99px;overflow:hidden}
.meter .fill{height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass));transition:width .3s ease}
.suit-r{color:#E07A66}
.suit-b{color:var(--mint)}

/* ---------- scoreboard ---------- */
.scores{margin-bottom:14px}
.scores .list{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mint)}
.scores .out{opacity:.4}
.hearts{color:var(--red);letter-spacing:1px}
.bok{color:var(--brass);margin-left:3px}

/* ---------- reveal ---------- */
.revrow{border-top:1px solid var(--edge);padding:12px 0}
.revrow .nm{font-weight:700}
.revrow .nm.lost{color:var(--red-soft)}
.revrow .sc{font-family:var(--serif);font-size:22px;font-weight:700}
.revrow .sc.hot{color:var(--brass)}
.delta{color:var(--red-soft);font-size:12px}

/* ---------- modal / toast ---------- */
#modal:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.sheet{background:var(--felt);border:1px solid var(--edge);border-radius:16px;padding:20px;max-width:320px;width:100%}
.sheet h2{font-family:var(--serif);font-size:22px;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--edge);color:var(--cream);padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:88%;text-align:center}

/* ---------- lobby ---------- */
.codebox{text-align:center;padding:16px;border:1px dashed var(--brass-dim);border-radius:14px}
.codebox .code{font-family:var(--serif);font-size:42px;font-weight:900;letter-spacing:.18em;color:var(--brass);line-height:1.1}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mint-dim)}
.dot.on{background:#5FBF8A}
.dot.off{background:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="./mqtt.min.js"></script>
<script src="./app.js"></script>
<script src="./online.js"></script>
<script>
  App.boot();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
